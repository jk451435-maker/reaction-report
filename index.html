<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反作用力訓練空間 — 週期報表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f2; --surface: #ffffff; --surface2: #f0efe9;
  --text: #1a1908; --text2: #6b6a55; --text3: #a8a790;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.15); --accent: #2a3897; --gold: #eabd18;
  --green: #2d6a2d; --green-bg: #eaf3e0; --red: #8b2020; --red-bg: #fceaea;
  --amber: #7a5000; --amber-bg: #fef3d8; --blue: #1a3d6b; --blue-bg: #e8f0fb;
  --purple: #3d2d7a; --purple-bg: #eeebfc;
  --mono: 'DM Mono', monospace; --sans: 'Noto Sans TC', sans-serif;
}
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }
header { background: var(--accent); color: #f7f6f2; padding: 1.5rem 2.5rem; display: flex; align-items: flex-end; justify-content: space-between; }
.logo { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); font-family: var(--mono); }
.logo span { display: block; font-size: 19px; font-weight: 700; color: #f7f6f2; margin-top: 4px; font-family: var(--sans); }
.header-period { font-family: var(--mono); font-size: 12px; color: var(--gold); text-align: right; }
.header-period strong { display: block; font-size: 15px; color: #f7f6f2; margin-top: 2px; }
main { max-width: 1040px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

/* UPLOAD */
.upload-month { margin-bottom: 1.25rem; }
.upload-month-label { font-size: 11px; font-family: var(--mono); letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
.upload-area { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.upload-box { border: 1.5px dashed var(--border2); border-radius: 12px; padding: 1.5rem 1rem; background: var(--surface); cursor: pointer; transition: background 0.15s, border-color 0.15s; text-align: center; }
.upload-box:hover, .upload-box.drag { background: var(--surface2); border-color: var(--accent); }
.upload-box.loaded { border-style: solid; border-color: var(--green); background: var(--green-bg); }
.upload-box input { display: none; }
.upload-icon { font-size: 22px; margin-bottom: 6px; display: block; }
.upload-title { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.upload-sub { font-size: 10px; color: var(--text3); }
.upload-filename { font-size: 10px; font-family: var(--mono); color: var(--green); margin-top: 6px; }
.run-btn { width: 100%; padding: 14px; background: var(--accent); color: #f7f6f2; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; font-family: var(--sans); cursor: pointer; transition: opacity 0.15s; margin-top: 1rem; letter-spacing: 0.02em; }
.run-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.run-btn:not(:disabled):hover { opacity: 0.85; }
.upload-divider { display: flex; align-items: center; gap: 12px; margin: 1rem 0; }
.upload-divider hr { flex: 1; border: none; border-top: 0.5px solid var(--border2); }
.upload-divider span { font-size: 11px; color: var(--text3); font-family: var(--mono); white-space: nowrap; }

/* TABS */
.tabs { display: flex; gap: 2px; margin-bottom: 1.5rem; border-bottom: 1.5px solid var(--border2); overflow-x: auto; }
.tab { padding: 10px 18px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: none; color: var(--text3); font-family: var(--sans); border-bottom: 2px solid transparent; margin-bottom: -1.5px; transition: color 0.15s; white-space: nowrap; }
.tab:hover { color: var(--text2); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* METRICS */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.metric { background: var(--surface); border-radius: 10px; padding: 1rem 1.25rem; border: 0.5px solid var(--border); }
.metric-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-family: var(--mono); letter-spacing: 0.04em; }
.metric-val { font-size: 21px; font-weight: 700; color: var(--text); }
.metric-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.metric.accent { border-left: 3px solid var(--accent); }

/* CARD */
.card { background: var(--surface); border-radius: 12px; border: 0.5px solid var(--border); padding: 1.25rem; margin-bottom: 1.25rem; }
.card-title { font-size: 11px; font-family: var(--mono); letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; margin-bottom: 1rem; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

/* TABLE */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { font-size: 10px; font-family: var(--mono); letter-spacing: 0.06em; color: var(--text3); text-align: left; padding: 0 10px 10px; border-bottom: 0.5px solid var(--border2); text-transform: uppercase; }
th.r, td.r { text-align: right; }
tbody tr { border-bottom: 0.5px solid var(--border); transition: background 0.1s; }
tbody tr:hover { background: var(--surface2); }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 8px 10px; }
tfoot td { border-top: 1.5px solid var(--border2); padding: 10px; font-weight: 700; font-size: 13px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 500; font-family: var(--mono); }
.b1v1 { background: var(--blue-bg); color: var(--blue); }
.b1v2 { background: var(--purple-bg); color: var(--purple); }
.c-green { color: var(--green); }
.c-red { color: var(--red); }
.c-amber { color: var(--amber); font-weight: 500; }
.c-muted { color: var(--text3); }

/* REVENUE */
.rev-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 0.5px solid var(--border); }
.rev-item:last-child { border-bottom: none; }
.rev-name { font-size: 13px; }
.rev-amt { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.rev-total { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 0; border-top: 1.5px solid var(--border2); margin-top: 4px; }
.rev-total-label { font-size: 13px; font-weight: 700; }
.rev-total-amt { font-family: var(--mono); font-size: 18px; font-weight: 700; }
.count-badge { display:inline-block;background:#e8f0fb;color:#1a3d6b;font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:99px;margin-left:6px; }
.expandable { cursor: pointer; user-select: none; }
.expandable:hover { background: var(--surface2); border-radius: 6px; }
.expand-icon { font-size: 11px; color: var(--text3); transition: transform 0.18s; display: inline-block; width: 14px; text-align: center; }
.expand-icon.open { transform: rotate(90deg); }
.detail-block { display: none; border-left: 2px solid var(--border2); margin: 0 0 4px 8px; padding: 2px 0; }
.detail-block.open { display: block; }
.detail-row { display: flex; align-items: center; padding: 5px 10px; font-size: 12px; border-bottom: 0.5px solid var(--border); }
.detail-row:last-child { border-bottom: none; }
.detail-name { flex: 1; color: var(--text); }
.detail-date { font-family: var(--mono); font-size: 11px; color: var(--text3); margin: 0 16px; }
.detail-amt { font-family: var(--mono); font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; }
.detail-note { font-size: 10px; color: var(--text3); background: var(--surface2); padding: 1px 6px; border-radius: 4px; }
.rev-group { margin-bottom: 2px; }

/* COMPARE */
.cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; }
.cmp-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.06em; color: var(--text3); text-transform: uppercase; margin-bottom: 6px; }
.cmp-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
.cmp-row:last-child { border-bottom: none; }
.cmp-row-label { color: var(--text2); }
.cmp-val { font-family: var(--mono); font-weight: 500; }
.delta { font-size: 11px; font-family: var(--mono); margin-left: 6px; }
.delta.up { color: var(--green); }
.delta.dn { color: var(--red); }
.delta.flat { color: var(--text3); }
.rank-no { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--surface2); font-size: 10px; font-family: var(--mono); text-align: center; line-height: 20px; margin-right: 6px; color: var(--text3); }
.rank-no.top { background: var(--accent); color: #f7f6f2; }

/* FOOTER */
.footer-actions { display: flex; gap: 10px; margin-top: 1.5rem; flex-wrap: wrap; }
.action-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-size: 12px; font-weight: 500; font-family: var(--sans); cursor: pointer; transition: background 0.1s; }
.action-btn:hover { background: var(--surface2); }
#results { display: none; }
.chart-wrap { position: relative; width: 100%; }
</style>
</head>
<body>
<header>
  <div class="logo">反作用力訓練空間<span>週期營運報表</span></div>
  <div class="header-period" id="headerPeriod">尚未載入資料</div>
</header>
<main>
  <!-- UPLOAD -->
  <div id="uploadSection">
    <div class="upload-month">
      <div class="upload-month-label">📅 本期資料</div>
      <div class="upload-area" style="grid-template-columns:1fr 1fr 1fr">
        <div class="upload-box" id="box1" onclick="document.getElementById('file1').click()">
          <span class="upload-icon">📋</span>
          <div class="upload-title">課表預約明細</div>
          <div class="upload-sub">團體課表預約明細拆帳版_*.xlsx</div>
          <div class="upload-filename" id="name1"></div>
          <input type="file" id="file1" accept=".xlsx,.xls">
        </div>
        <div class="upload-box" id="box2" onclick="document.getElementById('file2').click()">
          <span class="upload-icon">💳</span>
          <div class="upload-title">交易報表</div>
          <div class="upload-sub">交易報表_*.xlsx</div>
          <div class="upload-filename" id="name2"></div>
          <input type="file" id="file2" accept=".xlsx,.xls">
        </div>
        <div class="upload-box" id="box5" onclick="document.getElementById('file5').click()">
          <span class="upload-icon">🚪</span>
          <div class="upload-title">進出場記錄（選填）</div>
          <div class="upload-sub">用於計算自主訓練會員產能</div>
          <div class="upload-filename" id="name5"></div>
          <input type="file" id="file5" accept=".xlsx,.xls">
        </div>
      </div>
    </div>
    <div class="upload-divider"><hr><span>比較上期（選填）</span><hr></div>
    <div class="upload-month">
      <div class="upload-month-label">📅 上期資料（選填）</div>
      <div class="upload-area">
        <div class="upload-box" id="box3" onclick="document.getElementById('file3').click()">
          <span class="upload-icon">📋</span>
          <div class="upload-title">上期課表預約明細</div>
          <div class="upload-sub">選填，上傳後顯示月份比較</div>
          <div class="upload-filename" id="name3"></div>
          <input type="file" id="file3" accept=".xlsx,.xls">
        </div>
        <div class="upload-box" id="box4" onclick="document.getElementById('file4').click()">
          <span class="upload-icon">💳</span>
          <div class="upload-title">上期交易報表</div>
          <div class="upload-sub">選填，上傳後顯示月份比較</div>
          <div class="upload-filename" id="name4"></div>
          <input type="file" id="file4" accept=".xlsx,.xls">
        </div>
      </div>
    </div>
    <button class="run-btn" id="runBtn" disabled>上傳本期兩個檔案後自動分析</button>
  </div>

  <!-- RESULTS -->
  <div id="results">
    <div class="tabs" id="tabBar">
      <button class="tab active" onclick="switchTab('boss')">老闆摘要</button>
      <button class="tab" onclick="switchTab('revenue')">收入認列</button>
      <button class="tab" onclick="switchTab('trainer')">教練銷課</button>
      <button class="tab" onclick="switchTab('capacity')">產能利用率</button>
      <button class="tab" onclick="switchTab('chart')">教練分層</button>
      <button class="tab" id="compareTab" style="display:none" onclick="switchTab('compare')">月份比較</button>
    </div>

    <div class="tab-panel active" id="tab-boss"><div id="boss-content"></div></div>
    <div class="tab-panel" id="tab-revenue">
      <div class="metrics" id="rev-metrics"></div>
      <div class="card" style="margin-bottom:1.25rem">
        <div class="card-title">銷課實現明細（課表核銷）</div>
        <div id="sessionItems"></div>
      </div>
      <div class="card" id="unknownItems" style="display:none;border-color:#e8a800;background:#fffbf0">
        <div class="card-title" style="color:#7a5000">⚠️ 未識別品項（未計入收入）</div>
        <div class="unknown-body"></div>
      </div>
      <div class="card"><div class="card-title" style="color:var(--text3)">場租預收款明細（教練購堂，未計入當期收入）</div><div id="rentItems"></div></div>
      <div class="card"><div class="card-title">會籍收入明細</div><div id="memberItems"></div></div>
    </div>
    <div class="tab-panel" id="tab-trainer">
      <div class="metrics" id="trainer-metrics"></div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
          <span class="card-title" style="margin-bottom:0">教練銷課明細</span>
          <div style="display:flex;gap:8px">
            <span class="badge b1v1" style="font-size:11px;padding:3px 10px">1v1</span>
            <span class="badge b1v2" style="font-size:11px;padding:3px 10px">1v2</span>
          </div>
        </div>
        <div id="trainerContent"></div>
      </div>
    </div>
    <div class="tab-panel" id="tab-chart">
      <div id="chart-content"></div>
    </div>
    <div class="tab-panel" id="tab-capacity"><div id="capacity-content"></div></div>
    <div class="tab-panel" id="tab-compare"><div id="compare-content"></div></div>

    <div class="footer-actions">
      <button class="action-btn" id="dlBtn">⬇ 下載 Excel 報表</button>
      <button class="action-btn" onclick="resetAll()">↺ 重新上傳</button>
    </div>
  </div>
</main>

<script>
// ── STATE ──────────────────────────────────────────────
let rawSchedule=null, rawTx=null, rawSchedulePrev=null, rawTxPrev=null, rawEntryLog=null;
let periodText='', periodTextPrev='';
let chart1Instance=null, chart2Instance=null, chart3Instance=null;
let exportTrainer=[], exportRevenue={};
let trainerSortKey='total', trainerSortDir='desc';
let prevTrainer=[], prevRevenue={};

// ── FILE HANDLING ──────────────────────────────────────
function setupDrop(boxId, inputId, nameId, slot) {
  const box=document.getElementById(boxId), input=document.getElementById(inputId);
  box.addEventListener('dragover', e=>{e.preventDefault();box.classList.add('drag');});
  box.addEventListener('dragleave', ()=>box.classList.remove('drag'));
  box.addEventListener('drop', e=>{e.preventDefault();box.classList.remove('drag');readFile(e.dataTransfer.files[0],slot,nameId,boxId);});
  input.addEventListener('change', e=>readFile(e.target.files[0],slot,nameId,boxId));
}
function readFile(file,slot,nameId,boxId) {
  if (!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(slot===1) rawSchedule=raw;
    else if(slot===2) rawTx=raw;
    else if(slot===3) rawSchedulePrev=raw;
    else if(slot===4) rawTxPrev=raw;
    else rawEntryLog=raw;
    document.getElementById(nameId).textContent=file.name;
    document.getElementById(boxId).classList.add('loaded');
    checkReady();
  };
  reader.readAsArrayBuffer(file);
}
function checkReady() {
  const btn=document.getElementById('runBtn');
  if(rawSchedule && rawTx) {
    btn.disabled=false;
    btn.textContent='▶ 開始分析';
  }
}
[1,2,3,4,5].forEach(i=>setupDrop('box'+i,'file'+i,'name'+i,i));
document.getElementById('runBtn').addEventListener('click', analyze);

// ── PARSE SCHEDULE ─────────────────────────────────────
function parseSchedule(raw, setPeriod) {
  const title=raw[0][0]||'';
  const m=title.match(/(\d{4}\/\d{2}\/\d{2})[~～](\d{4}\/\d{2}\/\d{2})/);
  const period = m ? m[1]+' – '+m[2] : '';
  if(setPeriod) periodText=period;
  else periodTextPrev=period;

  const headers=raw[1].map(h=>String(h));
  const rows=raw.slice(2).filter(r=>r.some(c=>c!==''));
  const col=name=>headers.indexOf(name);
  const iT=col('會員姓名'),iC=col('課程名稱'),iS=col('到課狀態'),iA=col('費用換算現金(元)');

  const map={};
  rows.forEach(r=>{
    const trainer=String(r[iT]||'').trim();
    const course=String(r[iC]||'').trim();
    const status=String(r[iS]||'').trim();
    const amt=parseFloat(r[iA])||0;
    if(!trainer||!course) return;
    const key=trainer+'||'+course+'||'+amt;
    if(!map[key]) map[key]={trainer,course,price:amt,total:0,arrived:0,noshow:0};
    map[key].total++;
    status==='到課'?map[key].arrived++:map[key].noshow++;
  });
  return Object.values(map).map(r=>({...r,arrAmt:r.total*r.price})).sort((a,b)=>a.trainer.localeCompare(b.trainer,'zh'));
}

// ── PARSE TRANSACTIONS ─────────────────────────────────
function parseTx(raw) {
  const headers=raw[1].map(h=>String(h));
  const rows=raw.slice(2).filter(r=>r.some(c=>c!==''));
  const col=name=>headers.indexOf(name);
  const iType=col('交易項目'),iPlan=col('方案/商品名稱'),iAmt=col('實收金額(元)'),iTotal=col('總計(元)');
  const iQty=col('數量'),iUnit=col('單位'),iName=col('會員姓名'),iDate=col('交易日期');
  const rent=[],member=[],unknown=[],purchases=[];
  rows.forEach(r=>{
    const type=String(r[iType]||'').trim();
    const plan=String(r[iPlan]||'').trim().replace(/\t/g,'');
    const amt=parseFloat(r[iAmt])||0;
    const total=parseFloat(r[iTotal])||0;
    const qty=parseFloat(r[iQty])||0;
    const unit=String(r[iUnit]||'').trim();
    const name=String(r[iName]||'').trim();
    const date=String(r[iDate]||'').trim();
    if(name==='假教練'||plan==='堂數') return;
    if(type==='儲值'&&amt>0) {
      if(plan.includes('場租')||plan.includes('置物櫃')||plan.includes('PFT')||plan.includes('Inbody')) {
        rent.push({name,plan,qty,unit,amt,date});
        if(plan.includes('場租')) purchases.push({name,plan,qty,amt,date});
      } else {
        unknown.push({name,plan,qty,unit,amt,date,type});
      }
    }
    if(type==='定期通行卡'&&amt>0) {
      if(plan==='年約會員') {
        const monthly=Math.round(total/12);
        const recognized=amt<monthly?amt:monthly;
        const note=amt<monthly?`總計$${total}÷12=$${monthly}，實收較低認列$${amt}`:`總計$${total}÷12月`;
        member.push({name,plan,qty,unit,total:amt,recognized,date,note});
      } else {
        member.push({name,plan,qty,unit,total:amt,recognized:amt,date,note:''});
      }
    }
  });
  return {rent,member,unknown,purchases};
}

function calcRevenue(rent,member,unknown,purchases,trainerData) {
  const rentTotal=rent.reduce((s,r)=>s+r.amt,0); // 預收款（現金流入）
  const memberRecognized=member.reduce((s,r)=>s+r.recognized,0);
  // 實現收入 = 當期實際銷課金額（核銷制）
  const sessionRealized=trainerData.reduce((s,r)=>s+r.arrAmt,0);
  const totalRevenue=sessionRealized+memberRecognized;
  return {rent,member,unknown,purchases,rentTotal,memberRecognized,sessionRealized,totalRevenue};
}

// ── ANALYZE ────────────────────────────────────────────
function analyze() {
  if(!rawSchedule||!rawTx) return;
  const trainerData=parseSchedule(rawSchedule,true);
  const {rent,member,unknown,purchases}=parseTx(rawTx);
  const revData=calcRevenue(rent,member,unknown,purchases,trainerData);
  exportTrainer=trainerData; exportRevenue=revData;

  // prev period
  if(rawSchedulePrev&&rawTxPrev) {
    prevTrainer=parseSchedule(rawSchedulePrev,false);
    const {rent:pr,member:pm,unknown:pu,purchases:pp}=parseTx(rawTxPrev);
    prevRevenue=calcRevenue(pr,pm,pu,pp,prevTrainer);
    document.getElementById('compareTab').style.display='';
    renderCompare(trainerData,revData,prevTrainer,prevRevenue);
  } else {

  }

  document.getElementById('headerPeriod').innerHTML=`分析週期<strong>${periodText||'—'}</strong>`;

function mergeByName(items) {
  const m=new Map();
  items.forEach(r=>{
    if(!m.has(r.name)) m.set(r.name,{name:r.name,n:0,dates:[],amt:0,recognized:0,notes:[]});
    const g=m.get(r.name);
    g.n++; g.amt+=r.amt||0; g.recognized+=r.recognized||0;
    if(r.date) g.dates.push(r.date);
    if(r.note&&!g.notes.includes(r.note)) g.notes.push(r.note);
  });
  return [...m.values()];
}

// ── ENTRY LOG PARSING (自主訓練會員) ──────────────────
const ENTRY_LOG_EXCLUDE = ['員工進出場方案','麋鹿會籍','自由教練入場'];

function parseEntryLog(raw) {
  if (!raw || raw.length < 2) return { count: 0, items: [] };
  const headers = raw[0].map(h => String(h));
  const rows = raw.slice(1).filter(r => r.some(c => c !== ''));
  const col = name => headers.indexOf(name);
  const iCat = col('類別'), iPlan = col('進場方案/預約名稱'), iName = col('姓名'), iDate = col('進場日期');

  const items = [];
  rows.forEach(r => {
    const cat = String(r[iCat]||'').trim();
    const plan = String(r[iPlan]||'').trim();
    const name = String(r[iName]||'').trim();
    const date = String(r[iDate]||'').trim();
    if (cat !== '定期通行卡') return; // 排除計次卡、課程進出場（已算在課表）
    if (ENTRY_LOG_EXCLUDE.includes(plan)) return; // 排除員工、麋鹿、自由教練入場
    items.push({ name, plan, date });
  });
  return { count: items.length, items };
}

// ── CAPACITY UTILIZATION ──────────────────────────────
const CAPACITY_PER_SLOT = 30; // 場館同時容納人數
const WEEKDAY_HOURS = 14; // 平日 08-22
const WEEKEND_HOURS = 10; // 假日 08-18
const SESSION_MINUTES = 60;

function parseDateRange(raw) {
  const title = raw[0][0] || '';
  const m = title.match(/(\d{4}\/\d{2}\/\d{2})[~～](\d{4}\/\d{2}\/\d{2})/);
  if (!m) return null;
  const start = new Date(m[1]);
  const end = new Date(m[2]);
  return { start, end };
}

function calcCapacity(dateRange) {
  if (!dateRange) return null;
  let weekdays = 0, weekends = 0;
  const cur = new Date(dateRange.start);
  while (cur <= dateRange.end) {
    const day = cur.getDay();
    if (day === 0 || day === 6) weekends++;
    else weekdays++;
    cur.setDate(cur.getDate() + 1);
  }
  const weekdaySlots = (WEEKDAY_HOURS * 60 / SESSION_MINUTES) * CAPACITY_PER_SLOT * weekdays;
  const weekendSlots = (WEEKEND_HOURS * 60 / SESSION_MINUTES) * CAPACITY_PER_SLOT * weekends;
  return { weekdays, weekends, totalCapacity: Math.round(weekdaySlots + weekendSlots) };
}

function renderCapacity(trainerData, rawScheduleRaw, entryLogRaw) {
  const dateRange = parseDateRange(rawScheduleRaw);
  const cap = calcCapacity(dateRange);
  const totalSessions = trainerData.reduce((s,r)=>s+r.total,0);

  if (!cap) {
    document.getElementById('capacity-content').innerHTML = `<div class="card"><p style="font-size:13px;color:var(--text3)">無法判斷期間長度，請確認課表檔案的標題格式。</p></div>`;
    return;
  }

  // 1v1 佔用2人額度（教練+學員），1v2 佔用3人額度（教練+2學員）
  const d1v1 = trainerData.filter(r=>!r.course.toLowerCase().includes('1v2')&&!r.course.includes('一對二'));
  const d1v2 = trainerData.filter(r=>r.course.toLowerCase().includes('1v2')||r.course.includes('一對二'));
  const sessions1v1 = d1v1.reduce((s,r)=>s+r.total,0);
  const sessions1v2 = d1v2.reduce((s,r)=>s+r.total,0);
  const trainerHeadcount = sessions1v1*2 + sessions1v2*3;

  // 自主訓練會員（進出場記錄），每人次佔1人額度
  const entryLog = parseEntryLog(entryLogRaw);
  const selfTrainHeadcount = entryLog.count;

  const usedHeadcount = trainerHeadcount + selfTrainHeadcount;
  const usageRate = cap.totalCapacity ? (usedHeadcount / cap.totalCapacity * 100) : 0;
  const idle = cap.totalCapacity - usedHeadcount;

// ── COMPARE TAB ────────────────────────────────────────
function renderCompare(curTrainer,curRev,prvTrainer,prvRev) {
  function delta(cur,prv,isMoney=true) {
    const diff=cur-prv;
    const pct=prv?((diff/prv)*100).toFixed(1):'—';
    const cls=diff>0?'up':diff<0?'dn':'flat';
    const sign=diff>0?'+':'';
    const fmt=isMoney?`$${Math.abs(diff).toLocaleString()}`:`${Math.abs(diff)}`;
    return `<span class="delta ${cls}">${sign}${isMoney?'$':''}${diff>=0?'':'-'}${isMoney?Math.abs(diff).toLocaleString():Math.abs(diff)} (${sign}${pct}%)</span>`;
  }

  const curSess=curTrainer.reduce((s,r)=>s+r.total,0);
  const prvSess=prvTrainer.reduce((s,r)=>s+r.total,0);
  const curAmt=curTrainer.reduce((s,r)=>s+r.arrAmt,0);
  const prvAmt=prvTrainer.reduce((s,r)=>s+r.arrAmt,0);
  const curCount=[...new Set(curTrainer.map(r=>r.trainer))].length;
  const prvCount=[...new Set(prvTrainer.map(r=>r.trainer))].length;

  // trainer map for comparison
  const curTMap={}, prvTMap={};
  curTrainer.forEach(r=>{if(!curTMap[r.trainer])curTMap[r.trainer]={sessions:0,amt:0};curTMap[r.trainer].sessions+=r.total;curTMap[r.trainer].amt+=r.arrAmt;});
  prvTrainer.forEach(r=>{if(!prvTMap[r.trainer])prvTMap[r.trainer]={sessions:0,amt:0};prvTMap[r.trainer].sessions+=r.total;prvTMap[r.trainer].amt+=r.arrAmt;});
  const allTrainers=[...new Set([...Object.keys(curTMap),...Object.keys(prvTMap)])].sort();

  document.getElementById('compare-content').innerHTML=`
    <div class="card" style="margin-bottom:1.25rem">
      <div class="card-title">收入對比　<span style="font-weight:400;color:var(--text2)">${periodTextPrev} vs ${periodText}</span></div>
      <div class="cmp-grid">
        <div>
          <div class="cmp-label">上期</div>
          <div class="cmp-row"><span class="cmp-row-label">實現收入</span><span class="cmp-val">$${prvRev.totalRevenue.toLocaleString()}</span></div>
          <div class="cmp-row"><span class="cmp-row-label">場租預收款</span><span class="cmp-val">$${prvRev.rentTotal.toLocaleString()}</span></div>
          <div class="cmp-row"><span class="cmp-row-label">會籍認列</span><span class="cmp-val">$${prvRev.memberRecognized.toLocaleString()}</span></div>
          <div class="cmp-row"><span class="cmp-row-label">銷課堂數</span><span class="cmp-val">${prvSess} 堂</span></div>
          <div class="cmp-row"><span class="cmp-row-label">銷課金額</span><span class="cmp-val">$${prvAmt.toLocaleString()}</span></div>
          <div class="cmp-row"><span class="cmp-row-label">教練數</span><span class="cmp-val">${prvCount} 位</span></div>
        </div>
        <div>
          <div class="cmp-label">本期 vs 上期</div>
          <div class="cmp-row"><span class="cmp-row-label">實現收入</span><span><span class="cmp-val">$${curRev.totalRevenue.toLocaleString()}</span> ${delta(curRev.totalRevenue,prvRev.totalRevenue)}</span></div>
          <div class="cmp-row"><span class="cmp-row-label">場租預收款</span><span><span class="cmp-val">$${curRev.rentTotal.toLocaleString()}</span> ${delta(curRev.rentTotal,prvRev.rentTotal)}</span></div>
          <div class="cmp-row"><span class="cmp-row-label">會籍認列</span><span><span class="cmp-val">$${curRev.memberRecognized.toLocaleString()}</span> ${delta(curRev.memberRecognized,prvRev.memberRecognized)}</span></div>
          <div class="cmp-row"><span class="cmp-row-label">銷課堂數</span><span><span class="cmp-val">${curSess} 堂</span> ${delta(curSess,prvSess,false)}</span></div>
          <div class="cmp-row"><span class="cmp-row-label">銷課金額</span><span><span class="cmp-val">$${curAmt.toLocaleString()}</span> ${delta(curAmt,prvAmt)}</span></div>
          <div class="cmp-row"><span class="cmp-row-label">教練數</span><span><span class="cmp-val">${curCount} 位</span> ${delta(curCount,prvCount,false)}</span></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">教練銷課對比</div>
      <table>
        <thead><tr><th>教練</th><th class="r">上期堂</th><th class="r">本期堂</th><th class="r">堂數變化</th><th class="r">上期金額</th><th class="r">本期金額</th><th class="r">金額變化</th></tr></thead>
        <tbody>${allTrainers.map(name=>{
          const c=curTMap[name]||{sessions:0,amt:0};
          const p=prvTMap[name]||{sessions:0,amt:0};
          const dSess=c.sessions-p.sessions;
          const dAmt=c.amt-p.amt;
          const isNew=!prvTMap[name]&&curTMap[name];
          const isGone=prvTMap[name]&&!curTMap[name];
          return `<tr>
            <td>${name}${isNew?` <span class="badge b1v1" style="font-size:9px">新</span>`:''}${isGone?` <span class="badge" style="background:#fceaea;color:#8b2020;font-size:9px">無</span>`:''}</td>
            <td class="r ${!p.sessions?'c-muted':''}">${p.sessions||'—'}</td>
            <td class="r ${!c.sessions?'c-muted':''}">${c.sessions||'—'}</td>
            <td class="r ${dSess>0?'c-green':dSess<0?'c-red':'c-muted'}">${dSess>0?'+':''}${dSess||'—'}</td>
            <td class="r ${!p.amt?'c-muted':''}">$${p.amt?p.amt.toLocaleString():'—'}</td>
            <td class="r ${!c.amt?'c-muted':''}">$${c.amt?c.amt.toLocaleString():'—'}</td>
            <td class="r ${dAmt>0?'c-green':dAmt<0?'c-red':'c-muted'}">${dAmt!==0?(dAmt>0?'+$':'-$')+Math.abs(dAmt).toLocaleString():'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
}

// ── TRAINER TIER TAB ──────────────────────────────────
function renderCharts(trainerData, revData, prevTrainerData) {
  // Build current period trainer map
  const curMap = {};
  trainerData.forEach(r => {
    if (!curMap[r.trainer]) curMap[r.trainer] = { sessions: 0, amt: 0 };
    curMap[r.trainer].sessions += r.total;
    curMap[r.trainer].amt += r.arrAmt;
  });

  // Build prev period trainer map (if available)
  const prvMap = {};
  if (prevTrainerData && prevTrainerData.length) {
    prevTrainerData.forEach(r => {
      if (!prvMap[r.trainer]) prvMap[r.trainer] = { sessions: 0, amt: 0 };
      prvMap[r.trainer].sessions += r.total;
      prvMap[r.trainer].amt += r.arrAmt;
    });
  }

  const hasPrev = Object.keys(prvMap).length > 0;
  const trainers = Object.entries(curMap).sort((a,b)=>b[1].sessions-a[1].sessions);
  const totalSessions = trainers.reduce((s,[,v])=>s+v.sessions,0);

  // Tier logic
  function getTier(name, cur) {
    if (hasPrev) {
      const prv = prvMap[name];
      if (!prv) return 'new';
      const delta = cur.sessions - prv.sessions;
      const pct = prv.sessions ? delta / prv.sessions : 0;
      if (pct >= 0.15 || delta >= 5) return 'growing';
      if (pct <= -0.15 || delta <= -5) return 'watch';
      return 'core';
    } else {
      // single period: by volume
      if (cur.sessions >= 20) return 'core';
      if (cur.sessions >= 8) return 'mid';
      return 'low';
    }
  }

  const tiers = hasPrev
    ? { core: { label:'🏆 穩定核心', desc:'堂數穩定，變動 ±15% 以內', color:'#1a1908', bg:'#f0efe9', items:[] },
        growing: { label:'📈 成長中', desc:'本期堂數明顯增加', color:'#2d6a2d', bg:'#eaf3e0', items:[] },
        watch: { label:'⚠️ 需關注', desc:'本期堂數明顯下滑', color:'#8b2020', bg:'#fdf0ef', items:[] },
        new: { label:'🆕 新進教練', desc:'上期未出現，本期首次', color:'#1a3d6b', bg:'#e8f0fb', items:[] } }
    : { core: { label:'🏆 高量教練', desc:'≥ 20 堂', color:'#1a1908', bg:'#f0efe9', items:[] },
        mid: { label:'📊 中量教練', desc:'8–19 堂', color:'#1a3d6b', bg:'#e8f0fb', items:[] },
        low: { label:'🌱 低量教練', desc:'< 8 堂', color:'#7a5000', bg:'#fef3d8', items:[] } };

  trainers.forEach(([name, cur]) => {
    const tier = getTier(name, cur);
    const prv = prvMap[name];
    const delta = prv ? cur.sessions - prv.sessions : null;
    const deltaStr = delta !== null ? (delta > 0 ? `+${delta}` : `${delta}`) : null;
    tiers[tier].items.push({ name, sessions: cur.sessions, amt: cur.amt, deltaStr, pct: totalSessions ? Math.round(cur.sessions/totalSessions*100) : 0 });
  });

  // Render tier cards
  const tierCards = Object.values(tiers).filter(t=>t.items.length>0).map(tier => `
    <div class="card" style="border-color:${tier.color}20;margin-bottom:1.25rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <div>
          <div style="font-size:14px;font-weight:700;color:${tier.color}">${tier.label}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${tier.desc}</div>
        </div>
        <div style="background:${tier.bg};color:${tier.color};font-family:var(--mono);font-size:12px;padding:4px 12px;border-radius:99px;font-weight:500">${tier.items.length} 位</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${tier.items.map(t => `
          <div style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:${tier.bg};border-radius:8px">
            <div style="flex:1;font-size:13px;font-weight:500">${t.name}</div>
            <div style="font-size:12px;color:var(--text3);font-family:var(--mono)">${t.pct}%</div>
            ${t.deltaStr ? `<div style="font-size:12px;font-family:var(--mono);color:${t.deltaStr.startsWith('+')?'var(--green)':'var(--red)'}">${t.deltaStr}堂</div>` : ''}
            <div style="font-size:13px;font-family:var(--mono);font-weight:500;min-width:50px;text-align:right">${t.sessions} 堂</div>
            <div style="font-size:12px;color:var(--text3);font-family:var(--mono);min-width:70px;text-align:right">$${t.amt.toLocaleString()}</div>
            <div style="width:80px;background:rgba(0,0,0,0.08);border-radius:3px;height:5px;overflow:hidden">
              <div style="width:${t.pct}%;height:100%;background:${tier.color};border-radius:3px"></div>
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');

  document.getElementById('chart-content').innerHTML = `
    <div style="margin-bottom:1.5rem">
      <div style="font-size:12px;color:var(--text3);margin-bottom:4px">
        ${hasPrev ? '比較上期，依堂數變化幅度分層' : '單期資料，依堂數高低分層（上傳上期資料後可顯示趨勢）'}
      </div>
    </div>
    ${tierCards}`;
}

// ── TABS ───────────────────────────────────────────────
function switchTab(id) {
  const ids=['boss','revenue','trainer','capacity','chart','compare'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',ids[i]===id));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
}

// ── TOGGLE DETAIL ──────────────────────────────────────
function toggleDetail(id) {
  const block=document.getElementById(id),icon=document.getElementById('icon-'+id);
  if(!block) return;
  const isOpen=block.classList.contains('open');
  block.classList.toggle('open',!isOpen);
  if(icon) icon.classList.toggle('open',!isOpen);
}
