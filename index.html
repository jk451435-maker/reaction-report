<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反作用力訓練空間 — 週期報表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --surface2: #f0efe9;
  --text: #1a1908;
  --text2: #6b6a55;
  --text3: #a8a790;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.15);
  --accent: #1a1908;
  --green: #2d6a2d;
  --green-bg: #eaf3e0;
  --red: #8b2020;
  --red-bg: #fceaea;
  --amber: #7a5000;
  --amber-bg: #fef3d8;
  --blue: #1a3d6b;
  --blue-bg: #e8f0fb;
  --purple: #3d2d7a;
  --purple-bg: #eeebfc;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans TC', sans-serif;
}
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
header {
  background: var(--text);
  color: #f7f6f2;
  padding: 1.5rem 2.5rem;
  display: flex; align-items: flex-end; justify-content: space-between;
}
.logo { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a8a78a; font-family: var(--mono); }
.logo span { display: block; font-size: 19px; font-weight: 700; color: #f7f6f2; letter-spacing: 0.01em; margin-top: 4px; font-family: var(--sans); }
.header-period { font-family: var(--mono); font-size: 12px; color: #a8a78a; text-align: right; }
.header-period strong { display: block; font-size: 15px; color: #f7f6f2; margin-top: 2px; }

/* MAIN */
main { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

/* UPLOAD */
.upload-area { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
.upload-box {
  border: 1.5px dashed var(--border2);
  border-radius: 12px;
  padding: 2rem 1.5rem;
  background: var(--surface);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  text-align: center;
  position: relative;
}
.upload-box:hover, .upload-box.drag { background: var(--surface2); border-color: var(--accent); }
.upload-box.loaded { border-style: solid; border-color: var(--green); background: var(--green-bg); }
.upload-box input { display: none; }
.upload-icon { font-size: 28px; margin-bottom: 10px; display: block; }
.upload-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.upload-sub { font-size: 11px; color: var(--text3); }
.upload-filename { font-size: 11px; font-family: var(--mono); color: var(--green); margin-top: 8px; }

.run-btn {
  width: 100%;
  padding: 14px;
  background: var(--text);
  color: #f7f6f2;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  font-family: var(--sans);
  cursor: pointer;
  transition: opacity 0.15s;
  margin-bottom: 2.5rem;
  letter-spacing: 0.02em;
}
.run-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.run-btn:not(:disabled):hover { opacity: 0.85; }

/* TABS */
.tabs { display: flex; gap: 2px; margin-bottom: 1.5rem; border-bottom: 1.5px solid var(--border2); }
.tab {
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--text3);
  font-family: var(--sans);
  border-bottom: 2px solid transparent;
  margin-bottom: -1.5px;
  transition: color 0.15s;
}
.tab:hover { color: var(--text2); }
.tab.active { color: var(--text); border-bottom-color: var(--text); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* METRIC GRID */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.metric {
  background: var(--surface);
  border-radius: 10px;
  padding: 1rem 1.25rem;
  border: 0.5px solid var(--border);
}
.metric-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-family: var(--mono); letter-spacing: 0.04em; }
.metric-val { font-size: 22px; font-weight: 700; color: var(--text); }
.metric-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.metric.green .metric-val { color: var(--green); }
.metric.red .metric-val { color: var(--red); }
.metric.amber .metric-val { color: var(--amber); }

/* CARD */
.card { background: var(--surface); border-radius: 12px; border: 0.5px solid var(--border); padding: 1.25rem; margin-bottom: 1.25rem; }
.card-title { font-size: 11px; font-family: var(--mono); letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; margin-bottom: 1rem; }

/* TABLE */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  font-size: 10px; font-family: var(--mono); letter-spacing: 0.06em;
  color: var(--text3); text-align: left; padding: 0 10px 10px;
  border-bottom: 0.5px solid var(--border2); text-transform: uppercase;
}
th.r, td.r { text-align: right; }
tbody tr { border-bottom: 0.5px solid var(--border); transition: background 0.1s; }
tbody tr:hover { background: var(--surface2); }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 9px 10px; }
tfoot td { border-top: 1.5px solid var(--border2); padding: 10px; font-weight: 700; font-size: 13px; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 500; font-family: var(--mono); }
.b1v1 { background: var(--blue-bg); color: var(--blue); }
.b1v2 { background: var(--purple-bg); color: var(--purple); }
.c-green { color: var(--green); }
.c-red { color: var(--red); }
.c-amber { color: var(--amber); font-weight: 500; }
.c-muted { color: var(--text3); }

/* REVENUE ROWS */
.rev-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 0.5px solid var(--border); }
.rev-item:last-child { border-bottom: none; }
.rev-name { font-size: 13px; }
.rev-detail { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }
.rev-amt { font-family: var(--mono); font-size: 13px; font-weight: 500; }
.rev-total { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 0; border-top: 1.5px solid var(--border2); margin-top: 4px; }
.rev-total-label { font-size: 13px; font-weight: 700; }
.rev-total-amt { font-family: var(--mono); font-size: 18px; font-weight: 700; }

/* CHART */
.chart-wrap { position: relative; width: 100%; }

/* FOOTER */
.footer-actions { display: flex; gap: 10px; margin-top: 1.5rem; flex-wrap: wrap; }
.action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 18px; border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--surface); color: var(--text);
  font-size: 12px; font-weight: 500; font-family: var(--sans);
  cursor: pointer; transition: background 0.1s;
}
.action-btn:hover { background: var(--surface2); }

#results { display: none; }
.boss-section { margin-bottom: 1.5rem; }
.boss-kpi { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 1.25rem; }
.boss-kpi .metric { border-left: 3px solid var(--accent); }
.boss-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.boss-table th { font-size: 10px; font-family: var(--mono); letter-spacing: 0.06em; color: var(--text3); text-align: left; padding: 0 10px 8px; border-bottom: 0.5px solid var(--border2); text-transform: uppercase; }
.boss-table th.r, .boss-table td.r { text-align: right; }
.boss-table td { padding: 8px 10px; border-bottom: 0.5px solid var(--border); font-size: 13px; }
.boss-table tr:last-child td { border-bottom: none; }
.boss-table tfoot td { border-top: 1.5px solid var(--border2); font-weight: 700; padding: 10px; }
.rank-no { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--surface2); font-size: 10px; font-family: var(--mono); text-align: center; line-height: 20px; margin-right: 6px; color: var(--text3); }
.rank-no.top { background: var(--accent); color: #f7f6f2; }
.warn-row { background: #fffbf0; }
.expandable { cursor: pointer; user-select: none; }
.expandable:hover { background: var(--surface2); border-radius: 6px; }
.expand-icon { font-size: 11px; color: var(--text3); transition: transform 0.18s; display: inline-block; width: 14px; text-align: center; }
.expand-icon.open { transform: rotate(90deg); }
.count-badge { display:inline-block;background:#e8f0fb;color:#1a3d6b;font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:99px;margin-left:6px; }
.detail-block { display: none; border-left: 2px solid var(--border2); margin: 0 0 4px 8px; padding: 2px 0; }
.detail-block.open { display: block; }
.detail-row { display: flex; align-items: center; padding: 5px 10px; font-size: 12px; border-bottom: 0.5px solid var(--border); }
.detail-row:last-child { border-bottom: none; }
.detail-name { flex: 1; color: var(--text); }
.detail-date { font-family: var(--mono); font-size: 11px; color: var(--text3); margin: 0 16px; }
.detail-amt { font-family: var(--mono); font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; }
.detail-note { font-size: 10px; color: var(--text3); background: var(--surface2); padding: 1px 6px; border-radius: 4px; }
.rev-group { margin-bottom: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    反作用力訓練空間
    <span>週期營運報表</span>
  </div>
  <div class="header-period" id="headerPeriod">
    尚未載入資料
  </div>
</header>

<main>
  <!-- UPLOAD -->
  <div id="uploadSection">
    <div class="upload-area">
      <div class="upload-box" id="box1" onclick="document.getElementById('file1').click()">
        <span class="upload-icon">📋</span>
        <div class="upload-title">課表預約明細</div>
        <div class="upload-sub">團體課表預約明細拆帳版_*.xlsx</div>
        <div class="upload-filename" id="name1"></div>
        <input type="file" id="file1" accept=".xlsx,.xls">
      </div>
      <div class="upload-box" id="box2" onclick="document.getElementById('file2').click()">
        <span class="upload-icon">💳</span>
        <div class="upload-title">交易報表</div>
        <div class="upload-sub">交易報表_*.xlsx</div>
        <div class="upload-filename" id="name2"></div>
        <input type="file" id="file2" accept=".xlsx,.xls">
      </div>
    </div>
    <button class="run-btn" id="runBtn" disabled>上傳兩個檔案後自動分析</button>
  </div>

  <!-- RESULTS -->
  <div id="results">
    <div class="tabs">
      <button class="tab" onclick="switchTab('boss')">老闆摘要</button>
      <button class="tab active" onclick="switchTab('revenue')">收入認列</button>
      <button class="tab" onclick="switchTab('trainer')">教練銷課</button>
      <button class="tab" onclick="switchTab('chart')">圖表</button>
    </div>

    <!-- TAB: REVENUE -->
    <div class="tab-panel active" id="tab-revenue">
      <div class="metrics" id="rev-metrics"></div>
      <div class="card">
        <div class="card-title">場租儲值明細（教練購堂）</div>
        <div id="rentItems"></div>
      </div>
      <div class="card">
        <div class="card-title">會籍收入明細</div>
        <div id="memberItems"></div>
      </div>
    </div>

    <!-- TAB: TRAINER -->
    <div class="tab-panel" id="tab-trainer">
      <div class="metrics" id="trainer-metrics"></div>
      <div class="card">
        <div class="card-title-row" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem"><span class="card-title" style="margin-bottom:0">教練銷課明細</span><div style="display:flex;gap:8px"><span class="badge b1v1" style="font-size:11px;padding:3px 10px">1v1</span><span class="badge b1v2" style="font-size:11px;padding:3px 10px">1v2</span></div></div>
        <div id="trainerContent"></div>
      </div>
    </div>

    <!-- TAB: CHART -->
    <div class="tab-panel" id="tab-chart">
      <div class="card">
        <div class="card-title">教練到課金額</div>
        <div class="chart-wrap" id="chartWrap1" style="height:400px">
          <canvas id="chart1"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-title">收入來源組成</div>
        <div class="chart-wrap" style="height:280px">
          <canvas id="chart2"></canvas>
        </div>
      </div>
    </div>

    <!-- TAB: BOSS -->
    <div class="tab-panel" id="tab-boss">
      <div id="boss-content"></div>
    </div>

    <div class="footer-actions">
      <button class="action-btn" id="dlBtn">⬇ 下載 Excel 報表</button>
      <button class="action-btn" onclick="resetAll()">↺ 重新上傳</button>
    </div>
  </div>
</main>

<script>
// ── STATE ──────────────────────────────────────────────
let rawSchedule = null, rawTx = null;
let periodText = '';
let chart1Instance = null, chart2Instance = null;
let exportTrainer = [], exportRevenue = [];

// ── FILE HANDLING ───────────────────────────────────────
function setupDrop(boxId, inputId, nameId, slot) {
  const box = document.getElementById(boxId);
  const input = document.getElementById(inputId);
  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag'); });
  box.addEventListener('dragleave', () => box.classList.remove('drag'));
  box.addEventListener('drop', e => {
    e.preventDefault(); box.classList.remove('drag');
    readFile(e.dataTransfer.files[0], slot, nameId, boxId);
  });
  input.addEventListener('change', e => readFile(e.target.files[0], slot, nameId, boxId));
}

function readFile(file, slot, nameId, boxId) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (slot === 1) rawSchedule = raw;
    else rawTx = raw;
    document.getElementById(nameId).textContent = file.name;
    document.getElementById(boxId).classList.add('loaded');
    checkReady();
  };
  reader.readAsArrayBuffer(file);
}

function checkReady() {
  const btn = document.getElementById('runBtn');
  if (rawSchedule && rawTx) {
    btn.disabled = false;
    btn.textContent = '▶ 開始分析';
    analyze();
  }
}

setupDrop('box1','file1','name1',1);
setupDrop('box2','file2','name2',2);
document.getElementById('runBtn').addEventListener('click', analyze);

// ── PARSE SCHEDULE ──────────────────────────────────────
function parseSchedule(raw) {
  // Detect period from title row
  const title = raw[0][0] || '';
  const m = title.match(/(\d{4}\/\d{2}\/\d{2})[~～](\d{4}\/\d{2}\/\d{2})/);
  if (m) periodText = m[1] + ' – ' + m[2];

  const headers = raw[1].map(h => String(h));
  const rows = raw.slice(2).filter(r => r.some(c => c !== ''));

  const col = name => headers.indexOf(name);
  const iT = col('會員姓名'), iC = col('課程名稱'), iS = col('到課狀態'), iA = col('費用換算現金(元)');

  const map = {};
  rows.forEach(r => {
    const trainer = String(r[iT]||'').trim();
    const course  = String(r[iC]||'').trim();
    const status  = String(r[iS]||'').trim();
    const amt     = parseFloat(r[iA]) || 0;
    if (!trainer || !course) return;
    const key = trainer + '||' + course + '||' + amt;
    if (!map[key]) map[key] = { trainer, course, price: amt, total:0, arrived:0, noshow:0 };
    map[key].total++;
    status === '到課' ? map[key].arrived++ : map[key].noshow++;
  });

  return Object.values(map).map(r => ({ ...r, arrAmt: r.total * r.price }))
    .sort((a,b) => a.trainer.localeCompare(b.trainer, 'zh'));
}

// ── PARSE TRANSACTIONS ──────────────────────────────────
function parseTx(raw) {
  const headers = raw[1].map(h => String(h));
  const rows = raw.slice(2).filter(r => r.some(c => c !== ''));

  const col = name => headers.indexOf(name);
  const iType = col('交易項目'), iPlan = col('方案/商品名稱');
  const iAmt  = col('實收金額(元)'), iTotal = col('總計(元)'), iQty = col('數量'), iUnit = col('單位');
  const iName = col('會員姓名'), iDate = col('交易日期');

  const rent = [], member = [];

  rows.forEach(r => {
    const type  = String(r[iType]||'').trim();
    const plan  = String(r[iPlan]||'').trim().replace(/\t/g,'');
    const amt   = parseFloat(r[iAmt]) || 0;
    const total = parseFloat(r[iTotal]) || 0;
    const qty   = parseFloat(r[iQty]) || 0;
    const unit  = String(r[iUnit]||'').trim();
    const name  = String(r[iName]||'').trim();
    const date  = String(r[iDate]||'').trim();

    // 過濾假教練與堂數轉入
    if (name === '假教練' || plan === '堂數') return;

    // 場租儲值 - 教練購堂
    if (type === '儲值' && amt > 0 && plan.includes('場租')) {
      rent.push({ name, plan, qty, unit, amt, date });
    }

    // 置物櫃 - 一次全額認列
    if (type === '儲值' && amt > 0 && plan.includes('置物櫃')) {
      rent.push({ name, plan, qty, unit, amt, date });
    }

    // 會籍
    if (type === '定期通行卡' && amt > 0) {
      // 年約: 先算總計÷12=月費，實收若低於月費（退費/未收）則認列實收
      if (plan === '年約會員') {
        const monthly = Math.round(total / 12);
        const recognized = amt < monthly ? amt : monthly;
        const note = amt < monthly ? `總計$${total}÷12=$${monthly}，實收$${amt}較低，認列$${amt}` : `總計$${total}÷12月`;
        member.push({ name, plan, qty, unit, total: amt, recognized, date, note });
      } else {
        member.push({ name, plan, qty, unit, total: amt, recognized: amt, date, note: '' });
      }
    }
  });

  return { rent, member };
}

// ── ANALYZE ─────────────────────────────────────────────
function analyze() {
  if (!rawSchedule || !rawTx) return;

  const trainerData = parseSchedule(rawSchedule);
  const { rent, member } = parseTx(rawTx);

  exportTrainer = trainerData;

  // Revenue totals
  const rentTotal  = rent.reduce((s,r) => s + r.amt, 0);
  const memberRecognized = member.reduce((s,r) => s + r.recognized, 0);
  const totalRevenue = rentTotal + memberRecognized;

  exportRevenue = { rent, member, rentTotal, memberRecognized, totalRevenue };
  renderBoss(trainerData, exportRevenue);

  // Trainer totals
  const totalSessions = trainerData.reduce((s,r) => s + r.total, 0);
  const arrivedSessions = trainerData.reduce((s,r) => s + r.arrived, 0);
  const noshowSessions = trainerData.reduce((s,r) => s + r.noshow, 0);
  const trainerAmt = trainerData.reduce((s,r) => s + r.arrAmt, 0);
  const rate = totalSessions ? Math.round(arrivedSessions/totalSessions*100) : 0;

  // Update header
  document.getElementById('headerPeriod').innerHTML =
    `分析週期<strong>${periodText || '—'}</strong>`;

  // ── REVENUE TAB ──
  document.getElementById('rev-metrics').innerHTML = `
    <div class="metric"><div class="metric-label">當期總收入</div><div class="metric-val">$${totalRevenue.toLocaleString()}</div><div class="metric-sub">元</div></div>
    <div class="metric"><div class="metric-label">場租儲值</div><div class="metric-val">$${rentTotal.toLocaleString()}</div><div class="metric-sub">${rent.length} 筆</div></div>
    <div class="metric"><div class="metric-label">會籍認列</div><div class="metric-val">$${memberRecognized.toLocaleString()}</div><div class="metric-sub">${member.length} 筆</div></div>
  `;

  // Rent items
  const rentByPlan = {};
  rent.forEach(r => {
    const k = r.plan;
    if (!rentByPlan[k]) rentByPlan[k] = { plan: r.plan, count: 0, total: 0, names: [] };
    rentByPlan[k].count++;
    rentByPlan[k].total += r.amt;
    rentByPlan[k].names.push(r.name);
  });
  const rentHTML = Object.values(rentByPlan).sort((a,b)=>b.total-a.total).map((p,i) => {
    const detailRows = rent.filter(r => r.plan === p.plan).map(r => `
      <div class="detail-row"><span class="detail-name">${r.name}</span><span class="detail-date">${r.date}</span><span class="detail-amt">$${r.amt.toLocaleString()}</span></div>
    `).join('');
    return `
    <div class="rev-group">
      <div class="rev-item expandable" onclick="toggleDetail('rent-${i}')">
        <div style="flex:1"><div class="rev-name">${p.plan} <span class="count-badge">${p.count} 筆</span></div></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="rev-amt">$${p.total.toLocaleString()}</div><span class="expand-icon" id="icon-rent-${i}">▸</span></div>
      </div>
      <div class="detail-block" id="rent-${i}">${detailRows}</div>
    </div>
  `;}).join('');
  document.getElementById('rentItems').innerHTML = rentHTML + `
    <div class="rev-total"><div class="rev-total-label">小計</div><div class="rev-total-amt">$${rentTotal.toLocaleString()}</div></div>`;

  // Member items - group by plan
  const memByPlan = {};
  member.forEach(r => {
    const k = r.plan;
    if (!memByPlan[k]) memByPlan[k] = { plan: r.plan, count: 0, recognized: 0, names: [] };
    memByPlan[k].count++;
    memByPlan[k].recognized += r.recognized;
    memByPlan[k].names.push(r.name);
  });
  const memHTML = Object.values(memByPlan).sort((a,b)=>b.recognized-a.recognized).map((p,i) => {
    const detailRows = member.filter(r => r.plan === p.plan).map(r => `
      <div class="detail-row"><span class="detail-name">${r.name}</span><span class="detail-date">${r.date}</span><span class="detail-amt">$${r.recognized.toLocaleString()}${r.note ? '<span class=\'detail-note\'>' + r.note + '</span>' : ''}</span></div>
    `).join('');
    return `
    <div class="rev-group">
      <div class="rev-item expandable" onclick="toggleDetail('mem-${i}')">
        <div style="flex:1"><div class="rev-name">${p.plan} <span class="count-badge">${p.count} 筆</span></div></div>
        <div style="display:flex;align-items:center;gap:10px"><div class="rev-amt">$${p.recognized.toLocaleString()}</div><span class="expand-icon" id="icon-mem-${i}">▸</span></div>
      </div>
      <div class="detail-block" id="mem-${i}">${detailRows}</div>
    </div>
  `;}).join('');
  document.getElementById('memberItems').innerHTML = memHTML + `
    <div class="rev-total"><div class="rev-total-label">小計（認列）</div><div class="rev-total-amt">$${memberRecognized.toLocaleString()}</div></div>`;

  // ── TRAINER TAB ──
  document.getElementById('trainer-metrics').innerHTML = `
    <div class="metric"><div class="metric-label">總銷課堂數</div><div class="metric-val">${totalSessions}</div><div class="metric-sub">堂</div></div>
    <div class="metric"><div class="metric-label">銷課金額</div><div class="metric-val">$${trainerAmt.toLocaleString()}</div><div class="metric-sub">元</div></div>
  `;

  function renderTrainerSection(data, label, badgeClass) {
    if (!data.length) return '';
    const tot = data.reduce((s,r)=>s+r.total,0);
    const arr = data.reduce((s,r)=>s+r.arrived,0);
    const nos = data.reduce((s,r)=>s+r.noshow,0);
    const amt = data.reduce((s,r)=>s+r.arrAmt,0);
    const rr  = tot ? Math.round(arr/tot*100) : 0;
    const rows = data.map(r => {
      const rrr = r.total ? Math.round(r.arrived/r.total*100) : 0;
      const warn = rrr < 50 && r.total >= 3;
      return `<tr>
        <td>${r.trainer}</td>
        <td class="r">$${r.price}</td>
        <td class="r">${r.total}</td>
        <td class="r">$${r.arrAmt.toLocaleString()}</td>
      </tr>`;
    }).join('');
    return `
      <div style="margin-bottom:1.25rem">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span class="badge ${badgeClass}" style="font-size:11px;padding:3px 10px">${label}</span>
          <span style="font-size:11px;color:var(--text3);font-family:var(--mono)">${data.length} 位教練・${tot} 堂・$${amt.toLocaleString()}</span>
        </div>
        <table>
          <thead><tr>
            <th>教練</th>
            <th class="r">單價</th><th class="r">銷課堂數</th>
            <th class="r">銷課金額</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr>
            <td>小計</td>
            <td class="r"></td>
            <td class="r">${tot}</td>
            <td class="r">$${amt.toLocaleString()}</td>
          </tr></tfoot>
        </table>
      </div>`;
  }

  const data1v1 = trainerData.filter(r => !r.course.toLowerCase().includes('1v2') && !r.course.includes('一對二'));
  const data1v2 = trainerData.filter(r => r.course.toLowerCase().includes('1v2') || r.course.includes('一對二'));

  document.getElementById('trainerContent').innerHTML =
    renderTrainerSection(data1v1, '1v1 一對一', 'b1v1') +
    renderTrainerSection(data1v2, '1v2 一對二', 'b1v2') +
    `<div style="border-top:1.5px solid var(--border2);padding-top:10px;display:flex;justify-content:space-between;font-size:13px;font-weight:700">
      <span>總合計</span>
      <span style="font-family:var(--mono)">${totalSessions} 堂・$${trainerAmt.toLocaleString()}</span>
    </div>`;

  // ── CHARTS ──
  const trainerMap = {};
  trainerData.forEach(r => { trainerMap[r.trainer] = (trainerMap[r.trainer]||0) + r.arrAmt; });
  const sorted = Object.entries(trainerMap).sort((a,b)=>b[1]-a[1]);
  const h = Math.max(300, sorted.length*34+60);
  document.getElementById('chartWrap1').style.height = h+'px';
  if (chart1Instance) chart1Instance.destroy();
  chart1Instance = new Chart(document.getElementById('chart1'), {
    type: 'bar',
    data: {
      labels: sorted.map(e=>e[0]),
      datasets: [{ data: sorted.map(e=>e[1]), backgroundColor: '#1a1908', borderRadius: 4, borderSkipped: false }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` $${c.parsed.x.toLocaleString()}` } } },
      scales: {
        x: { ticks: { callback: v=>'$'+v.toLocaleString(), font:{size:11} }, grid:{color:'rgba(0,0,0,0.05)'} },
        y: { ticks: { font:{size:11} }, grid:{display:false} }
      }
    }
  });

  if (chart2Instance) chart2Instance.destroy();
  chart2Instance = new Chart(document.getElementById('chart2'), {
    type: 'doughnut',
    data: {
      labels: ['場租儲值','會籍認列'],
      datasets: [{ data: [rentTotal, memberRecognized], backgroundColor: ['#1a1908','#a8a78a'], borderWidth: 0 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { font:{size:12}, boxWidth:14 } },
        tooltip: { callbacks: { label: c => ` $${c.parsed.toLocaleString()}` } }
      }
    }
  });

  document.getElementById('uploadSection').style.display = 'none';
  document.getElementById('results').style.display = 'block';
}

// ── TABS ────────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const ids = ['boss','revenue','trainer','chart'];
    t.classList.toggle('active', ids[i]===id);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
}

// ── EXPORT ──────────────────────────────────────────────
document.getElementById('dlBtn').addEventListener('click', () => {
  const wb = XLSX.utils.book_new();

  // Sheet 1: 教練拆帳
  const h1 = ['類型','教練','單價','總堂數','到課','未到','到課率','到課金額'];
  const d1 = exportTrainer.map(r => [
    ((!r.course.toLowerCase().includes('1v2')&&!r.course.includes('一對二'))?'1v1':'1v2'), r.trainer, r.price, r.total, r.arrived, r.noshow,
    r.total ? (r.arrived/r.total*100).toFixed(1)+'%' : '0%', r.arrAmt
  ]);
  const ws1 = XLSX.utils.aoa_to_sheet([h1,...d1]);
  ws1['!cols'] = [18,14,8,8,8,8,8,12].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws1, '教練拆帳');

  // Sheet 2: 收入認列
  const { rent, member, rentTotal, memberRecognized, totalRevenue } = exportRevenue;
  const h2 = ['類別','姓名/方案','日期','實收','當期認列','備註'];
  const d2 = [
    ...rent.map(r => ['場租儲值', r.name+' — '+r.plan, r.date, r.amt, r.amt, '']),
    ...member.map(r => ['會籍', r.name+' — '+r.plan, r.date, r.total, r.recognized, r.note]),
    [],
    ['', '場租小計', '', rentTotal, rentTotal, ''],
    ['', '會籍認列小計', '', '', memberRecognized, ''],
    ['', '當期總收入', '', '', totalRevenue, ''],
  ];
  const ws2 = XLSX.utils.aoa_to_sheet([h2,...d2]);
  ws2['!cols'] = [10,24,12,10,10,16].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws2, '收入認列');

  const fname = `週期報表_${(periodText||'').replace(/\//g,'').replace(' – ','-')}.xlsx`;
  XLSX.writeFile(wb, fname);
});

// ── RENDER BOSS SUMMARY ────────────────────────────────
function renderBoss(trainerData, revData) {
  const { rentTotal, memberRecognized, totalRevenue, rent, member } = revData;

  // KPIs
  const totalSessions = trainerData.reduce((s,r)=>s+r.total,0);
  const trainerAmt    = trainerData.reduce((s,r)=>s+r.arrAmt,0);
  const trainerCount  = [...new Set(trainerData.map(r=>r.trainer))].length;

  // Revenue breakdown
  const rentByPlan = {};
  rent.forEach(r => {
    const k = r.plan;
    if (!rentByPlan[k]) rentByPlan[k] = { plan: r.plan, count: 0, total: 0 };
    rentByPlan[k].count++;
    rentByPlan[k].total += r.amt;
  });
  const memByPlan = {};
  member.forEach(r => {
    const k = r.plan;
    if (!memByPlan[k]) memByPlan[k] = { plan: r.plan, count: 0, recognized: 0 };
    memByPlan[k].count++;
    memByPlan[k].recognized += r.recognized;
  });

  // Trainer ranking
  const trainerMap = {};
  trainerData.forEach(r => {
    if (!trainerMap[r.trainer]) trainerMap[r.trainer] = { sessions: 0, amt: 0 };
    trainerMap[r.trainer].sessions += r.total;
    trainerMap[r.trainer].amt += r.arrAmt;
  });
  const ranked = Object.entries(trainerMap).sort((a,b)=>b[1].amt-a[1].amt);

  // Revenue rows
  const allRevRows = [
    ...Object.values(rentByPlan).sort((a,b)=>b.total-a.total).map(p => ({
      name: p.plan, count: p.count, amt: p.total, cat: '場租'
    })),
    ...Object.values(memByPlan).sort((a,b)=>b.recognized-a.recognized).map(p => ({
      name: p.plan, count: p.count, amt: p.recognized, cat: '會籍'
    }))
  ].sort((a,b)=>b.amt-a.amt);

  document.getElementById('boss-content').innerHTML = `
    <div class="boss-section">
      <div class="card-title" style="margin-bottom:.75rem">當期總覽</div>
      <div class="boss-kpi">
        <div class="metric"><div class="metric-label">當期收入</div><div class="metric-val">$${totalRevenue.toLocaleString()}</div><div class="metric-sub">場租 + 會籍</div></div>
        <div class="metric"><div class="metric-label">教練銷課</div><div class="metric-val">${totalSessions} 堂</div><div class="metric-sub">${trainerCount} 位教練・$${trainerAmt.toLocaleString()}</div></div>
        <div class="metric"><div class="metric-label">場租儲值</div><div class="metric-val">$${rentTotal.toLocaleString()}</div><div class="metric-sub">會籍認列 $${memberRecognized.toLocaleString()}</div></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem">
      <div class="card">
        <div class="card-title">收入來源</div>
        <table class="boss-table">
          <thead><tr><th>品項</th><th>類型</th><th class="r">筆數</th><th class="r">金額</th></tr></thead>
          <tbody>${allRevRows.map(r => `
            <tr>
              <td>${r.name}</td>
              <td><span class="badge ${r.cat==='場租'?'b1v1':'b1v2'}" style="font-size:10px">${r.cat}</span></td>
              <td class="r">${r.count}</td>
              <td class="r">$${r.amt.toLocaleString()}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot><tr><td colspan="3">合計</td><td class="r">$${totalRevenue.toLocaleString()}</td></tr></tfoot>
        </table>
      </div>

      <div class="card">
        <div class="card-title">教練銷課排名</div>
        <table class="boss-table">
          <thead><tr><th colspan="2">教練</th><th class="r">堂數</th><th class="r">銷課金額</th></tr></thead>
          <tbody>${ranked.map(([name, v], i) => `
            <tr>
              <td style="width:28px"><span class="rank-no ${i<3?'top':''}">${i+1}</span></td>
              <td>${name}</td>
              <td class="r">${v.sessions}</td>
              <td class="r">$${v.amt.toLocaleString()}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot><tr><td colspan="2">合計</td><td class="r">${totalSessions}</td><td class="r">$${trainerAmt.toLocaleString()}</td></tr></tfoot>
        </table>
      </div>
    </div>
  `;
}

// ── TOGGLE DETAIL ───────────────────────────────────────
function toggleDetail(id) {
  const block = document.getElementById(id);
  const icon  = document.getElementById('icon-' + id);
  if (!block) return;
  const isOpen = block.classList.contains('open');
  block.classList.toggle('open', !isOpen);
  if (icon) icon.classList.toggle('open', !isOpen);
}

// ── RESET ───────────────────────────────────────────────
function resetAll() {
  rawSchedule = rawTx = null; periodText = '';
  ['file1','file2'].forEach(id => document.getElementById(id).value='');
  ['name1','name2'].forEach(id => document.getElementById(id).textContent='');
  ['box1','box2'].forEach(id => document.getElementById(id).classList.remove('loaded'));
  document.getElementById('runBtn').disabled = true;
  document.getElementById('runBtn').textContent = '上傳兩個檔案後自動分析';
  document.getElementById('results').style.display = 'none';
  document.getElementById('uploadSection').style.display = 'block';
  document.getElementById('headerPeriod').textContent = '尚未載入資料';
  switchTab('revenue');
}
</script>
